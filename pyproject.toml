[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfbot"
version = "1.0.0"
description = "Telegram Self-Bot with utilities, automation, reminders and more"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Selfbot Authors" }]
dependencies = [
    "telethon>=1.36",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.19",
    "APScheduler>=3.10",
    "pytz>=2024.1",
    "yt-dlp>=2024.4.9",
    "httpx>=0.27",
    "dnspython>=2.4",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "pillow>=10.0",
    "markdown>=3.5",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-whois>=0.9",
    "pypng>=0.20220715",
    "tzdata>=2024.1",
    "typer>=0.12",
    "python-socks>=2.0",
]

[project.scripts]
selfbot = "selfbot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
screenshot = ["playwright>=1.43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["selfbot"]

[tool.mypy]
python_version = "3.12"
packages = ["selfbot"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true